<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妯″瀷鐩戞帶 路 Scout Agent</title>
    <script src="/static/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/i18n.js"></script>
<!-- 鏋勫缓浜х墿锛歠rontend/src/app.css锛屾敼鏍峰紡璇锋敼閭ｉ噷鍐?npm run build -->
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/theme-workbuddy.css">
</head>
<body class="h-screen overflow-y-auto bg-surface-0 text-ink-1">
    <script>renderLangToggle();</script>

<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
    <!-- 椤舵爮 -->
    <div class="flex items-center gap-3 mb-6">
        <a href="/" class="p-2 -ml-2 rounded-lg hover:bg-surface-3 text-ink-3 transition-colors">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <h1 class="text-xl font-bold text-ink-1">妯″瀷鐩戞帶</h1>
        <div class="flex-1"></div>
        <!-- 鏃堕棿鑼冨洿鍒囨崲 -->
        <div class="flex gap-1 bg-surface-2 rounded-lg p-1" id="period-tabs">
            <button onclick="switchPeriod('day')" class="period-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors">浠婃棩</button>
            <button onclick="switchPeriod('week')" class="period-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors">鏈懆</button>
            <button onclick="switchPeriod('month')" class="period-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors">鏈湀</button>
            <button onclick="switchPeriod('year')" class="period-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors">鍏ㄥ勾</button>
        </div>
    </div>

    <!-- 姒傝鍗＄墖 -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="overview-cards">
        <div class="bg-surface-2 border border-line-soft rounded-xl p-4">
            <div class="text-xs text-ink-3 mb-1">鎬昏皟鐢ㄦ鏁?/div>
            <div class="text-2xl font-bold text-ink-1" id="stat-calls">鈥?/div>
        </div>
        <div class="bg-surface-2 border border-line-soft rounded-xl p-4">
            <div class="text-xs text-ink-3 mb-1">鎬?Token 娑堣€?/div>
            <div class="text-2xl font-bold text-accent-text" id="stat-tokens">鈥?/div>
        </div>
        <div class="bg-surface-2 border border-line-soft rounded-xl p-4">
            <div class="text-xs text-ink-3 mb-1">缂撳瓨鍛戒腑</div>
            <div class="text-2xl font-bold text-success" id="stat-cache">鈥?/div>
        </div>
        <div class="bg-surface-2 border border-line-soft rounded-xl p-4">
            <div class="text-xs text-ink-3 mb-1">骞冲潎寤惰繜</div>
            <div class="text-2xl font-bold text-warn" id="stat-latency">鈥?/div>
        </div>
    </div>

    <!-- 姣忔棩瓒嬪娍 -->
    <div class="bg-surface-2 border border-line-soft rounded-xl p-4 mb-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-semibold text-ink-2">姣忔棩 Token 娑堣€楄秼鍔?/h2>
            <span class="text-xs text-ink-3">鏈€杩?30 澶?/span>
        </div>
        <div class="bar-chart" id="daily-chart">
            <div class="text-ink-3 text-xs flex items-center justify-center w-full">鍔犺浇涓?..</div>
        </div>
    </div>

    <!-- 鎸夋ā鍨嬬粺璁?-->
    <div class="bg-surface-2 border border-line-soft rounded-xl p-4 mb-6">
        <h2 class="text-sm font-semibold text-ink-2 mb-4">鎸夋ā鍨嬬粺璁?/h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm" id="model-table">
                <thead>
                    <tr class="text-xs text-ink-3 border-b border-line-soft">
                        <th class="text-left py-2 pr-4">妯″瀷</th>
                        <th class="text-right py-2 px-4">璋冪敤娆℃暟</th>
                        <th class="text-right py-2 px-4">Prompt</th>
                        <th class="text-right py-2 px-4">Completion</th>
                        <th class="text-right py-2 px-4">鎬?Token</th>
                        <th class="text-right py-2 px-4">缂撳瓨鍛戒腑</th>
                        <th class="text-right py-2 pl-4">骞冲潎寤惰繜</th>
                    </tr>
                </thead>
                <tbody id="model-tbody">
                    <tr><td colspan="7" class="text-center text-ink-3 py-4">鍔犺浇涓?..</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 鏈€杩戣皟鐢?-->
    <div class="bg-surface-2 border border-line-soft rounded-xl p-4 mb-6">
        <h2 class="text-sm font-semibold text-ink-2 mb-4">鏈€杩戣皟鐢ㄨ褰?/h2>
        <div class="space-y-2" id="recent-list">
            <div class="text-ink-3 text-xs text-center py-4">鍔犺浇涓?..</div>
        </div>
    </div>
</div>

<script>
let currentPeriod = 'day';

function formatNum(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return n.toString();
}

function formatMs(ms) {
    if (!ms) return '鈥?;
    if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
    return Math.round(ms) + 'ms';
}

function switchPeriod(period) {
    currentPeriod = period;
    document.querySelectorAll('.period-btn').forEach(btn => {
        btn.classList.remove('bg-accent/20', 'text-accent-text');
        btn.classList.add('text-ink-3');
    });
    const btn = document.querySelectorAll('.period-btn')[['day','week','month','year'].indexOf(period)];
    btn.classList.add('bg-accent/20', 'text-accent-text');
    btn.classList.remove('text-ink-3');
    loadSummary();
}

async function loadSummary() {
    try {
        const r = await fetch(`/api/usage/summary?period=${currentPeriod}`);
        const d = await r.json();
        const t = d.total || {};
        document.getElementById('stat-calls').textContent = formatNum(t.call_count || 0);
        document.getElementById('stat-tokens').textContent = formatNum(t.total_tokens || 0);
        const cacheRate = t.call_count > 0 ? ((t.cache_hits || 0) / t.call_count * 100).toFixed(0) + '%' : '0%';
        document.getElementById('stat-cache').textContent = cacheRate;
        document.getElementById('stat-latency').textContent = formatMs(t.avg_latency);

        // 妯″瀷琛ㄦ牸
        const tbody = document.getElementById('model-tbody');
        if (d.models && d.models.length > 0) {
            tbody.innerHTML = d.models.map(m => `
                <tr class="border-b border-line-soft hover:bg-surface-3">
                    <td class="py-2.5 pr-4 text-ink-2 font-mono text-xs">${m.model}</td>
                    <td class="py-2.5 px-4 text-right text-ink-3">${formatNum(m.call_count)}</td>
                    <td class="py-2.5 px-4 text-right text-ink-3">${formatNum(m.prompt_tokens)}</td>
                    <td class="py-2.5 px-4 text-right text-ink-3">${formatNum(m.completion_tokens)}</td>
                    <td class="py-2.5 px-4 text-right text-accent-text font-medium">${formatNum(m.total_tokens)}</td>
                    <td class="py-2.5 px-4 text-right text-success">${m.cache_hits || 0}</td>
                    <td class="py-2.5 pl-4 text-right text-warn">${formatMs(m.avg_latency)}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-ink-3 py-4">鏆傛棤鏁版嵁</td></tr>';
        }
    } catch(e) {
        console.error('loadSummary error:', e);
    }
}

async function loadDaily() {
    try {
        const r = await fetch('/api/usage/daily?days=30');
        const d = await r.json();
        const data = d.data || [];
        const chart = document.getElementById('daily-chart');
        if (data.length === 0) {
            chart.innerHTML = '<div class="text-ink-3 text-xs flex items-center justify-center w-full">鏆傛棤鏁版嵁</div>';
            return;
        }
        const maxTokens = Math.max(...data.map(d => d.total_tokens || 0), 1);
        chart.innerHTML = data.reverse().map(d => {
            const h = Math.max((d.total_tokens / maxTokens * 100), 2);
            const date = d.date.slice(5);
            return `<div class="bar bg-accent/40" style="height:${h}%">
                <div class="bar-tip">${date} 路 ${formatNum(d.total_tokens)} tokens 路 ${d.call_count}${__t('娆?)}</div>
            </div>`;
        }).join('');
    } catch(e) {
        console.error('loadDaily error:', e);
    }
}

async function loadRecent() {
    try {
        const r = await fetch('/api/usage/recent?limit=15');
        const d = await r.json();
        const data = d.data || [];
        const list = document.getElementById('recent-list');
        if (data.length === 0) {
            list.innerHTML = '<div class="text-ink-3 text-xs text-center py-4">鏆傛棤鏁版嵁</div>';
            return;
        }
        list.innerHTML = data.map(r => {
            const time = r.timestamp ? r.timestamp.slice(11, 19) : '';
            const cacheBadge = r.cache_hit ? '<span class="text-success text-xs">鈿＄紦瀛?/span>' : '';
            return `
                <div class="flex items-center gap-3 py-2 px-3 rounded-lg hover:bg-surface-3">
                    <span class="text-xs text-ink-3 font-mono w-16">${time}</span>
                    <span class="text-xs text-ink-2 font-mono flex-1 truncate">${r.model}</span>
                    <span class="text-xs text-ink-3">${formatNum(r.prompt_tokens)}鈫?{formatNum(r.completion_tokens)}</span>
                    <span class="text-xs text-accent-text font-medium">${formatNum(r.total_tokens)}</span>
                    <span class="text-xs text-warn">${formatMs(r.latency_ms)}</span>
                    ${cacheBadge}
                </div>`;
        }).join('');
    } catch(e) {
        console.error('loadRecent error:', e);
    }
}

// 鍚姩
switchPeriod('day');
loadDaily();
loadRecent();
// 姣?30 绉掑埛鏂?
setInterval(() => { loadSummary(); loadRecent(); }, 30000);
</script>
<script src="/static/js/subshell.js"></script>
</body>
</html>
