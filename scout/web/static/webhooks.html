<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook 绠＄悊 路 Scout Agent</title>
    <script src="/static/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/i18n.js"></script>
<!-- 鏋勫缓浜х墿锛歠rontend/src/app.css锛屾敼鏍峰紡璇锋敼閭ｉ噷鍐?npm run build -->
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/theme-workbuddy.css">
</head>
<body class="h-screen overflow-hidden bg-surface-0 text-ink-1 flex flex-col">
    <script>renderLangToggle();</script>

<!-- 椤舵爮 -->
<div class="flex items-center gap-3 px-4 py-3 border-b border-line-soft flex-shrink-0">
    <a href="/" class="p-2 -ml-2 rounded-lg hover:bg-surface-3 text-ink-3 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-lg font-bold text-ink-1">馃敆 Webhook 绠＄悊</h1>
    <div class="flex-1"></div>
    <button onclick="loadAll()" class="btn-ghost">鍒锋柊</button>
</div>

<div class="flex-1 overflow-y-auto p-6">
    <!-- 鏂板缓 Webhook -->
    <div class="card p-5 max-w-3xl mb-6">
        <h2 class="text-sm font-semibold text-ink-1 mb-3">鏂板缓 Webhook</h2>
        <div class="space-y-3">
            <input id="wh-name" class="field" placeholder="鍚嶇О锛堝彲閫夛紝濡?閮ㄧ讲閫氱煡锛? data-i18n-placeholder="鍚嶇О锛堝彲閫夛紝濡?閮ㄧ讲閫氱煡锛?>
            <textarea id="wh-task" class="field min-h-[80px] resize-y" placeholder="浠诲姟鎻忚堪锛堝繀濉級鈥斺€旀敹鍒拌姹傛椂 Agent 鎵ц鐨勪换鍔°€傛敮鎸?{{event.xxx}} 鍗犱綅绗﹀紩鐢ㄨ姹備綋瀛楁銆? data-i18n-placeholder="浠诲姟鎻忚堪锛堝繀濉級鈥斺€旀敹鍒拌姹傛椂 Agent 鎵ц鐨勪换鍔°€傛敮鎸?{{event.xxx}} 鍗犱綅绗﹀紩鐢ㄨ姹備綋瀛楁銆?></textarea>
            <div class="flex justify-end">
                <button onclick="createWebhook()" class="btn-primary">鍒涘缓</button>
            </div>
        </div>
    </div>

    <!-- Webhook 鍒楄〃 -->
    <div class="max-w-3xl space-y-3" id="wh-list">
        <div class="text-center text-ink-3 text-sm py-10">鍔犺浇涓?..</div>
    </div>
</div>

<div id="toast" class="toast bg-surface-3"></div>

<script>
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function toast(msg) {
    msg = __tpl(msg);
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}
function fmtTime(iso) {
    if (!iso) return '浠庢湭';
    try { return new Date(iso).toLocaleString('zh-CN'); } catch(e) { return iso; }
}

async function loadAll() {
    try {
        const r = await fetch('/api/webhooks');
        const { webhooks } = await r.json();
        render(webhooks || []);
    } catch (e) {
        document.getElementById('wh-list').innerHTML = '<div class="text-center text-danger text-sm py-10">鍔犺浇澶辫触: ' + e.message + '</div>';
    }
}

function render(hooks) {
    const el = document.getElementById('wh-list');
    if (hooks.length === 0) {
        el.innerHTML = '<div class="text-center text-ink-3 text-sm py-10">鏆傛棤 Webhook</div>';
        return;
    }
    el.innerHTML = hooks.map(h => {
        const token = h.id;
        return `
        <div class="card p-4 space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-ink-1">${esc(h.name || '(鏈懡鍚?')}</span>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-ink-3">${__tpl(`璋冪敤 ${h.call_count || 0} 娆?路 鏈€杩?${fmtTime(h.last_called)}`)}</span>
                    <button onclick="testHook('${token}')" class="text-xs text-accent-text hover:underline" title="娴嬭瘯瑙﹀彂" data-i18n-title="娴嬭瘯瑙﹀彂">娴嬭瘯</button>
                    <button onclick="copyHook('${esc(h.url)}')" class="text-xs text-ink-3 hover:text-ink-1">澶嶅埗 URL</button>
                    <button onclick="deleteHook('${token}')" class="text-xs text-ink-3 hover:text-danger">鍒犻櫎</button>
                </div>
            </div>
            <div class="url-box bg-scrim/30 rounded p-2 text-ink-3">${esc(h.url)}</div>
            <div class="text-xs text-ink-3 bg-surface-3 rounded p-2">${esc((h.task || '').slice(0, 120))}${(h.task||'').length > 120 ? '...' : ''}</div>
        </div>`;
    }).join('');
}

async function createWebhook() {
    const task = document.getElementById('wh-task').value.trim();
    const name = document.getElementById('wh-name').value.trim();
    if (!task) { toast('璇峰～鍐欎换鍔℃弿杩?); return; }
    try {
        const r = await fetch('/api/webhooks', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name, task })
        });
        const d = await r.json();
        if (d.status === 'ok') {
            toast('Webhook 宸插垱寤?);
            document.getElementById('wh-task').value = '';
            document.getElementById('wh-name').value = '';
            await loadAll();
        } else { toast(d.error || '鍒涘缓澶辫触'); }
    } catch(e) { toast('鍒涘缓澶辫触: ' + e.message); }
}

async function deleteHook(token) {
    if (!confirm(__t('纭鍒犻櫎璇?Webhook锛?))) return;
    try {
        await fetch(`/api/webhooks/${token}`, { method: 'DELETE' });
        toast('宸插垹闄?);
        loadAll();
    } catch(e) { toast('鍒犻櫎澶辫触'); }
}

async function testHook(token) {
    try {
        const r = await fetch(`/api/webhook/${token}`, {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: '鏉ヨ嚜 Webhook 绠＄悊椤电殑娴嬭瘯瑙﹀彂' })
        });
        const d = await r.json();
        toast(d.message || '宸茶Е鍙?);
        setTimeout(loadAll, 1500);
    } catch(e) { toast('瑙﹀彂澶辫触: ' + e.message); }
}

async function copyHook(url) {
    try { await navigator.clipboard.writeText(url); toast('URL 宸插鍒?); }
    catch(e) { toast('澶嶅埗澶辫触锛岃鎵嬪姩澶嶅埗'); }
}

loadAll();
</script>
<script src="/static/js/subshell.js"></script>
</body>
</html>
