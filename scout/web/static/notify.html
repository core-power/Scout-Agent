<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>閫氱煡涓績 路 Scout Agent</title>
    <script src="/static/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/i18n.js"></script>
<!-- 鏋勫缓浜х墿锛歠rontend/src/app.css锛屾敼鏍峰紡璇锋敼閭ｉ噷鍐?npm run build -->
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/theme-workbuddy.css">
</head>
<body class="h-screen overflow-hidden bg-surface-0 text-ink-1 flex flex-col">
    <script>renderLangToggle();</script>

<!-- 椤舵爮 -->
<div class="flex items-center gap-3 px-4 py-3 border-b border-line-soft flex-shrink-0">
    <a href="/" class="p-2 -ml-2 rounded-lg hover:bg-surface-3 text-ink-3 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-lg font-bold text-ink-1">馃敂 閫氱煡涓績</h1>
    <div class="flex-1"></div>
    <button onclick="testPush()" class="btn-primary">鍙戦€佹祴璇曢€氱煡</button>
    <button onclick="loadAll()" class="btn-ghost">鍒锋柊</button>
</div>

<div class="flex-1 flex overflow-hidden">
    <!-- 宸︽爮锛氬亸濂介厤缃?-->
    <div class="w-[420px] flex-shrink-0 border-r border-line-soft overflow-y-auto p-4 space-y-4">
        <!-- 鎬诲紑鍏?-->
        <div class="card p-4 flex items-center justify-between">
            <div>
                <div class="text-sm text-ink-1 font-medium">鍚敤閫氱煡鎺ㄩ€?/div>
                <div class="text-xs text-ink-3 mt-0.5">鍏抽棴鍚庢墍鏈夎法娓犻亾鎺ㄩ€佹殏鍋?/div>
            </div>
            <div id="sw-enabled" class="switch" onclick="toggleEnabled()"><div class="knob"></div></div>
        </div>

        <!-- 鍩烘湰瑙勫垯 -->
        <div class="card p-4 space-y-3">
            <div class="text-sm text-ink-1 font-medium">鎺ㄩ€佽鍒?/div>
            <div class="flex items-center justify-between">
                <span class="text-xs text-ink-3">鏈€浣庣骇鍒?/span>
                <select id="min-level" class="field w-32" onchange="savePrefs()">
                    <option value="debug">debug</option>
                    <option value="info">info</option>
                    <option value="warning">warning</option>
                    <option value="critical">critical</option>
                </select>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-xs text-ink-3">鍘婚噸绐楀彛 (绉?</span>
                <input id="dedupe" type="number" min="0" class="field w-24" onchange="savePrefs()">
            </div>
        </div>

        <!-- 绫诲瀷绛栫暐 -->
        <div class="card p-4 space-y-2">
            <div class="text-sm text-ink-1 font-medium">鎸夌被鍨嬪紑鍏?/div>
            <div class="text-xs text-ink-3 mb-2">鎺у埗鍝簺绫诲瀷鐨勯€氱煡鍊煎緱鎺ㄩ€?/div>
            <div id="type-policy" class="space-y-2"></div>
        </div>

        <!-- IM 娓犻亾鐩爣 -->
        <div class="card p-4 space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-sm text-ink-1 font-medium">IM 娓犻亾鐩爣</div>
                    <div class="text-xs text-ink-3">閫氱煡灏嗕富鍔ㄦ帹閫佸埌杩欎簺娓犻亾</div>
                </div>
                <button onclick="addChannelRow()" class="btn-ghost text-xs" data-i18n="+ 娣诲姞">+ 娣诲姞</button>
            </div>
            <div id="channel-targets" class="space-y-2"></div>
        </div>

        <!-- 閭欢 -->
        <div class="card p-4 space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-sm text-ink-1 font-medium">閭欢鎺ㄩ€?(SMTP)</div>
                    <div class="text-xs text-ink-3">鍙€夛紝鐢ㄤ簬閲嶈閫氱煡鐨勯偖浠跺浠?/div>
                </div>
                <div id="sw-email" class="switch" onclick="toggleEmail()"><div class="knob"></div></div>
            </div>
            <div id="email-form" class="space-y-2">
                <input id="email-to" class="field" placeholder="鏀朵欢浜洪偖绠? data-i18n-placeholder="鏀朵欢浜洪偖绠?>
                <input id="smtp-host" class="field" placeholder="SMTP 涓绘満 (濡?smtp.qq.com)" data-i18n-placeholder="SMTP 涓绘満 (濡?smtp.qq.com)">
                <div class="flex gap-2">
                    <input id="smtp-port" class="field w-24" placeholder="绔彛 (465)" data-i18n-placeholder="绔彛 (465)" type="number">
                    <input id="smtp-user" class="field flex-1" placeholder="SMTP 璐﹀彿" data-i18n-placeholder="SMTP 璐﹀彿">
                </div>
                <input id="smtp-pass" class="field" placeholder="SMTP 瀵嗙爜/鎺堟潈鐮? data-i18n-placeholder="SMTP 瀵嗙爜/鎺堟潈鐮? type="password">
                <label class="flex items-center gap-2 text-xs text-ink-3">
                    <input id="smtp-ssl" type="checkbox" checked> 浣跨敤 SSL/TLS
                </label>
            </div>
            <button onclick="savePrefs()" class="btn-primary w-full">淇濆瓨鍋忓ソ</button>
        </div>
    </div>

    <!-- 鍙虫爮锛氭帹閫佸巻鍙?-->
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="px-4 py-2.5 border-b border-line-soft flex items-center gap-2 flex-shrink-0">
            <span class="text-sm text-ink-2 font-medium">鎺ㄩ€佸巻鍙?/span>
            <span class="text-xs text-ink-3">鏈€澶氫繚鐣?500 鏉?/span>
            <div class="flex-1"></div>
            <button onclick="clearHistory()" class="text-xs text-ink-3 hover:text-danger transition-colors">娓呯┖</button>
        </div>
        <div id="history" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </div>
</div>

<div id="toast" class="toast bg-surface-3"></div>

<script>
// 鈹€鈹€ 绫诲瀷鍏冧俊鎭?鈹€鈹€
const TYPE_META = {
    task_alert:      { label: '浠诲姟寮傚父', icon: '鈿狅笍', color: '#ef4444' },
    task_complete:   { label: '浠诲姟瀹屾垚', icon: '鉁?, color: '#10b981' },
    cron_triggered:  { label: '瀹氭椂瑙﹀彂', icon: '鈴?, color: '#f59e0b' },
    system:          { label: '绯荤粺',     icon: '鈿欙笍', color: '#3b82f6' },
    reminder:        { label: '鎻愰啋',     icon: '馃敂', color: '#a855f7' },
    default:         { label: '鍏朵粬',     icon: '馃搫', color: '#64748b' },
};

let prefs = null;

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function toast(msg) {
    msg = __tpl(msg);
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}

// 鈹€鈹€ 鍔犺浇 鈹€鈹€
async function loadAll() {
    await Promise.all([loadPrefs(), loadHistory()]);
}

async function loadPrefs() {
    try {
        const r = await fetch('/api/notify/prefs');
        const { prefs: p } = await r.json();
        prefs = p;
        renderPrefs();
    } catch (e) { console.error(e); toast('鍔犺浇鍋忓ソ澶辫触'); }
}

function renderPrefs() {
    if (!prefs) return;
    // 鎬诲紑鍏?
    const sw = document.getElementById('sw-enabled');
    sw.classList.toggle('on', !!prefs.enabled);
    // 鍩烘湰瑙勫垯
    document.getElementById('min-level').value = prefs.min_level || 'info';
    document.getElementById('dedupe').value = prefs.dedupe_seconds || 60;
    // 绫诲瀷绛栫暐
    const policyKeys = ['task_alert','task_complete','cron_triggered','system','reminder','default'];
    const tp = document.getElementById('type-policy');
    tp.innerHTML = policyKeys.map(k => {
        const meta = TYPE_META[k] || TYPE_META.default;
        const on = prefs.type_policy && prefs.type_policy[k] !== false;
        return `
        <div class="flex items-center justify-between px-2 py-1.5 rounded hover:bg-surface-3">
            <span class="text-xs text-ink-2">${meta.icon} ${__t(meta.label)}</span>
            <div class="switch ${on ? 'on' : ''}" onclick="toggleType('${k}')"><div class="knob"></div></div>
        </div>`;
    }).join('');
    // 娓犻亾鐩爣
    renderChannels();
    // 閭欢
    const e = prefs.email || {};
    document.getElementById('sw-email').classList.toggle('on', !!e.enabled);
    document.getElementById('email-to').value = e.to || '';
    document.getElementById('smtp-host').value = e.smtp_host || '';
    document.getElementById('smtp-port').value = e.smtp_port || 465;
    document.getElementById('smtp-user').value = e.smtp_user || '';
    document.getElementById('smtp-pass').value = e.smtp_password || '';
    document.getElementById('smtp-ssl').checked = e.smtp_ssl !== false;
}

function renderChannels() {
    const channels = (prefs && prefs.channels) || [];
    const cw = document.getElementById('channel-targets');
    if (channels.length === 0) {
        cw.innerHTML = '<div class="text-xs text-ink-3 text-center py-3">鏆傛棤娓犻亾鐩爣锛岀偣鍑诲彸涓婅"+"娣诲姞</div>';
        return;
    }
    cw.innerHTML = channels.map((c, i) => `
        <div class="flex items-center gap-2 bg-surface-3 rounded-lg p-2">
            <input data-idx="${i}" data-f="channel" class="field flex-1" placeholder="娓犻亾鍚?(濡?telegram)" data-i18n-placeholder="娓犻亾鍚?(濡?telegram)" value="${esc(c.channel)}" onchange="updateChannel(${i}, 'channel', this.value)">
            <input data-idx="${i}" data-f="target" class="field flex-1" placeholder="鐩爣 ID / 缇ょ粍" data-i18n-placeholder="鐩爣 ID / 缇ょ粍" value="${esc(c.target)}" onchange="updateChannel(${i}, 'target', this.value)">
            <div class="switch ${c.enabled !== false ? 'on' : ''}" onclick="toggleChannel(${i})"><div class="knob"></div></div>
            <button class="text-ink-3 hover:text-danger text-xs" onclick="removeChannel(${i})">鉁?/button>
        </div>`).join('');
}

// 鈹€鈹€ 浜や簰 鈹€鈹€
async function savePrefs() {
    if (!prefs) return;
    const body = {
        enabled: prefs.enabled,
        min_level: document.getElementById('min-level').value,
        dedupe_seconds: parseInt(document.getElementById('dedupe').value) || 0,
        email: {
            enabled: prefs.email ? !!prefs.email.enabled : false,
            to: document.getElementById('email-to').value,
            smtp_host: document.getElementById('smtp-host').value,
            smtp_port: parseInt(document.getElementById('smtp-port').value) || 465,
            smtp_user: document.getElementById('smtp-user').value,
            smtp_password: document.getElementById('smtp-pass').value,
            smtp_ssl: document.getElementById('smtp-ssl').checked,
        },
    };
    try {
        const r = await fetch('/api/notify/prefs', {
            method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        const d = await r.json();
        prefs = d.prefs || prefs;
        renderPrefs();
        toast('鍋忓ソ宸蹭繚瀛?);
    } catch (e) { toast('淇濆瓨澶辫触: ' + e.message); }
}

function toggleEnabled() {
    prefs.enabled = !prefs.enabled;
    document.getElementById('sw-enabled').classList.toggle('on', prefs.enabled);
    savePrefs();
}

function toggleEmail() {
    if (!prefs.email) prefs.email = {};
    prefs.email.enabled = !prefs.email.enabled;
    document.getElementById('sw-email').classList.toggle('on', prefs.email.enabled);
    savePrefs();
}

function toggleType(k) {
    if (!prefs.type_policy) prefs.type_policy = {};
    prefs.type_policy[k] = prefs.type_policy[k] === false;
    savePrefs();
}

function addChannelRow() {
    if (!prefs.channels) prefs.channels = [];
    prefs.channels.push({ channel: '', target: '', enabled: true });
    renderChannels();
    savePrefs();
}
function updateChannel(i, f, v) { prefs.channels[i][f] = v; savePrefs(); }
function toggleChannel(i) { prefs.channels[i].enabled = !(prefs.channels[i].enabled !== false); renderChannels(); savePrefs(); }
function removeChannel(i) { prefs.channels.splice(i, 1); renderChannels(); savePrefs(); }

async function testPush() {
    toast('姝ｅ湪鍙戦€佹祴璇曢€氱煡...');
    try {
        const r = await fetch('/api/notify/test', { method: 'POST' });
        const d = await r.json();
        if (d.result && d.result.pushed) { toast('娴嬭瘯閫氱煡宸叉帹閫?鉁?); loadHistory(); }
        else toast('鏈帹閫佸埌浠讳綍娓犻亾锛堟鏌ュ亸濂介厤缃級');
    } catch (e) { toast('娴嬭瘯澶辫触: ' + e.message); }
}

// 鈹€鈹€ 鍘嗗彶 鈹€鈹€
async function loadHistory() {
    const el = document.getElementById('history');
    try {
        const r = await fetch('/api/notify/history?limit=100');
        const { history } = await r.json();
        if (!history || history.length === 0) {
            el.innerHTML = '<div class="text-center text-ink-3 text-sm py-20" data-i18n="鏆傛棤鎺ㄩ€佽褰?>鏆傛棤鎺ㄩ€佽褰?/div>';
            return;
        }
        el.innerHTML = history.map(h => {
            const meta = TYPE_META[h.type] || TYPE_META.default;
            const ok = h.result && h.result.pushed;
            const ch = (h.result && h.result.channels || []).map(c => c.ok ? `${c.channel}鉁揱 : `${c.channel}鉁梎).join(' ');
            const dedupe = h.dedupe_hits > 0 ? ` <span class="text-warn" title="鍘婚噸鍚堝苟浜?${h.dedupe_hits} 娆?>鈯?{h.dedupe_hits}</span>` : '';
            return `
            <div class="card p-3 flex items-start gap-3">
                <span class="text-sm mt-0.5" style="color:${meta.color}">${meta.icon}</span>
                <div class="flex-1 min-w-0">
                    <div class="text-sm text-ink-1 truncate">${esc(h.title)}${dedupe}</div>
                    <div class="text-xs text-ink-3 mt-0.5 truncate">${esc(h.message || '')}</div>
                    <div class="text-xs text-ink-3 mt-1 flex items-center gap-2 flex-wrap">
                        <span>${esc(h.ts || '')}</span>
                        <span class="text-ink-3">${__t(meta.label)}</span>
                        ${ch ? `<span class="text-ink-3">鈫?${ch}</span>` : ''}
                        ${h.result && h.result.email ? '<span class="text-accent-text">馃摟 閭欢鉁?/span>' : ''}
                        ${!ok ? '<span class="text-ink-3">鏈帹閫?/span>' : ''}
                    </div>
                </div>
                <span class="text-xs ${ok ? 'text-success' : 'text-ink-3'}">${ok ? '宸叉帹閫? : '宸茶繃婊?}</span>
            </div>`;
        }).join('');
    } catch (e) {
        el.innerHTML = '<div class="text-center text-danger text-sm py-20">鍔犺浇澶辫触: ' + e.message + '</div>';
    }
}

async function clearHistory() {
    if (!confirm(__t('纭娓呯┖鍏ㄩ儴鎺ㄩ€佸巻鍙诧紵'))) return;
    try {
        await fetch('/api/notify/history', { method: 'DELETE' });
        toast('鍘嗗彶宸叉竻绌?);
        loadHistory();
    } catch (e) { toast('娓呯┖澶辫触'); }
}

loadAll();
</script>
<script src="/static/js/subshell.js"></script>
</body>
</html>
