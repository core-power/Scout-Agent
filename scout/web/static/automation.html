<script>
let allTriggers = [];

function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    ['triggers', 'runs', 'policy', 'cron'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
    });
    if (name === 'runs') loadRuns();
    if (name === 'cron') loadCron();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg, ok = true) {
    msg = __tpl(msg);
    const d = document.createElement('div');
    d.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm z-toast ${ok ? 'bg-success' : 'bg-danger'} text-ink-1`;
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2500);
}
async function api(url, method = 'GET', body = null) {
    const opt = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opt.body = JSON.stringify(body);
    const r = await fetch(url, opt);
    return r.json();
}

// 鈹€鈹€ 瑙﹀彂鍣?鈹€鈹€
function onTypeChange() {
    const t = document.getElementById('tg-type').value;
    document.getElementById('tg-event-wrap').classList.toggle('hidden', t !== 'event');
    document.getElementById('tg-cascade-wrap').classList.toggle('hidden', t !== 'cascade');
    if (t === 'cascade') renderCascadeOptions();
}
function renderCascadeOptions() {
    const sel = document.getElementById('tg-after');
    sel.innerHTML = '<option value="">閫夋嫨涓婃父瑙﹀彂鍣ㄢ€?/option>' +
        allTriggers.map(t => `<option value="${t.id}">${esc(t.name)} (${t.id})</option>`).join('');
}
async function loadTriggers() {
    const data = await api('/api/triggers');
    allTriggers = data.triggers || [];
    const list = document.getElementById('trigger-list');
    if (!allTriggers.length) {
        list.innerHTML = '<div class="text-center text-ink-3 text-sm py-8">鏆傛棤瑙﹀彂鍣?鈥?鍦ㄤ笂鏂瑰垱寤轰竴涓紝璁?Scout 鍝嶅簲浜嬩欢鑷姩骞叉椿</div>';
        return;
    }
    list.innerHTML = allTriggers.map(t => `
        <div class="bg-surface-1 border border-line rounded-xl p-3 flex items-center gap-3 flex-wrap">
            <span class="text-lg">${t.type === 'event' ? '鈿? : t.type === 'cascade' ? '馃敆' : '馃憜'}</span>
            <div class="flex-1 min-w-[200px]">
                <div class="text-sm text-ink-1">${esc(t.name)} <span class="text-xs text-ink-3">id=${t.id} 路 ${t.type}</span></div>
                <div class="text-xs text-ink-3 truncate mt-0.5">${esc(t.task_template.slice(0, 80))}</div>
                <div class="text-xs text-ink-3 mt-0.5">${__tpl(`瑙﹀彂 ${t.fire_count} 娆)}${t.last_fired ? ' 路 ' + __tpl(`鏈€杩?${new Date(t.last_fired * 1000).toLocaleString('zh-CN')}`) : ''}${t.event_name ? ' 路 ' + __tpl(`浜嬩欢 ${t.event_name}`) : ''}${t.after_trigger ? ' 路 ' + __tpl(`涓婃父 ${t.after_trigger}`) : ''}</div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="fireTrigger('${t.id}')" class="px-2.5 py-1 rounded-lg text-xs bg-accent/20 text-accent-text hover:bg-accent/35 transition-colors">杩愯</button>
                <button onclick="toggleTrigger('${t.id}')" class="px-2.5 py-1 rounded-lg text-xs bg-surface-3 hover:bg-surface-4 transition-colors">${t.enabled ? '鍋滅敤' : '鍚敤'}</button>
                <button onclick="delTrigger('${t.id}')" class="px-2.5 py-1 rounded-lg text-xs bg-danger/10 text-danger hover:bg-danger/20 transition-colors">鍒犻櫎</button>
            </div>
        </div>`).join('');
}
async function createTrigger() {
    const type = document.getElementById('tg-type').value;
    const body = {
        name: document.getElementById('tg-name').value.trim(),
        type: type,
        task_template: document.getElementById('tg-task').value.trim(),
        event_name: document.getElementById('tg-event-name').value.trim(),
        after_trigger: document.getElementById('tg-after').value,
        cooldown_seconds: parseInt(document.getElementById('tg-cooldown').value) || 0,
    };
    const filters = document.getElementById('tg-event-filters').value.trim();
    if (filters) { try { body.event_filters = JSON.parse(filters); } catch (e) { toast('杩囨护鍣?JSON 鏍煎紡閿欒', false); return; } }
    const verify = document.getElementById('tg-verify').value.trim();
    if (verify) { try { body.verification = JSON.parse(verify); } catch (e) { toast('楠岃瘉瑙勫垯 JSON 鏍煎紡閿欒', false); return; } }
    if (!body.name || !body.task_template) { toast('鍚嶇О鍜屼换鍔℃ā鏉垮繀濉?, false); return; }
    const r = await api('/api/triggers', 'POST', body);
    if (r.status === 'ok') { toast('瑙﹀彂鍣ㄥ凡鍒涘缓'); loadTriggers(); } else toast(r.error || '鍒涘缓澶辫触', false);
}
async function fireTrigger(id) {
    const r = await api(`/api/triggers/${id}/fire`, 'POST', { payload: {} });
    toast(r.status === 'success' ? '杩愯瀹屾垚 鉁? : __tpl(`杩愯缁撴灉: ${r.status}${r.reason ? ' - ' + r.reason : ''}`), r.status === 'success');
}
async function toggleTrigger(id) { await api(`/api/triggers/${id}/toggle`, 'POST'); loadTriggers(); }
async function delTrigger(id) {
    if (!confirm(__t('鍒犻櫎璇ヨЕ鍙戝櫒锛?))) return;
    await api(`/api/triggers/${id}`, 'DELETE');
    loadTriggers();
}

// 鈹€鈹€ 杩愯鍘嗗彶 鈹€鈹€
async function loadRuns() {
    const [runsData, statsData] = await Promise.all([api('/api/runs?limit=50'), api('/api/runs/stats?days=7')]);
    const statsEl = document.getElementById('runs-stats');
    let statHtml = __tpl(`杩?澶╁叡 ${statsData.total || 0} 娆¤繍琛宍);
    for (const [src, b] of Object.entries(statsData.by_source || {})) {
        statHtml += __tpl(` 路 ${src}: ${b.total}娆?{b.success_rate != null ? '(鎴愬姛鐜? + (b.success_rate * 100).toFixed(0) + '%)' : ''}`);
    }
    statsEl.textContent = statHtml;

    const list = document.getElementById('run-list');
    const runs = runsData.runs || [];
    if (!runs.length) {
        list.innerHTML = '<div class="text-center text-ink-3 text-sm py-8">鏆傛棤杩愯璁板綍</div>';
        return;
    }
    const statusMeta = { success: ['鉁?, 'text-success'], failed: ['鉂?, 'text-danger'], verification_failed: ['鈿狅笍', 'text-warn'], running: ['鈴?, 'text-ink-3'] };
    list.innerHTML = runs.map(r => {
        const [icon, color] = statusMeta[r.status] || ['鉂?, 'text-ink-3'];
        const started = new Date(r.started_at * 1000).toLocaleString('zh-CN');
        const dur = r.finished_at ? ((r.finished_at - r.started_at).toFixed(1) + 's') : '-';
        return `
        <div class="bg-surface-1 border border-line rounded-xl p-3">
            <div class="flex items-center gap-2 flex-wrap">
                <span>${icon}</span>
                <span class="text-sm text-ink-1 flex-1 truncate" title="${esc(r.task)}">${esc(r.task.slice(0, 60))}</span>
                <span class="text-xs text-ink-3">${r.source}</span>
                <span class="text-xs ${color}">${r.status}</span>
            </div>
            <div class="text-xs text-ink-3 mt-1">${started} 路 ${dur} 路 ${__tpl(`${r.steps || 0} 姝)} 路 ${__tpl(`${r.tool_calls || 0} 娆″伐鍏疯皟鐢╜)}</div>
            ${r.verification ? `<details class="mt-2"><summary class="text-xs text-ink-3 cursor-pointer hover:text-ink-2">${__tpl(`楠岃瘉璇佹嵁锛?{r.verification.passed ? __t('閫氳繃') : __t('鏈€氳繃')} 路 score ${r.verification.score}锛塦)}</summary><pre class="detail text-xs bg-scrim/40 rounded p-2 mt-1 text-ink-2">${esc(JSON.stringify(r.verification, null, 1))}</pre></details>` : ''}
            ${r.events && r.events.length ? `<details class="mt-1"><summary class="text-xs text-ink-3 cursor-pointer hover:text-ink-2">${__tpl(`鎵ц浜嬩欢娴侊紙${r.events.length} 鏉★級`)}</summary><pre class="detail text-xs bg-scrim/40 rounded p-2 mt-1 text-ink-2">${esc(JSON.stringify(r.events, null, 1))}</pre></details>` : ''}
        </div>`;
    }).join('');
}

// 鈹€鈹€ 绛栫暐 鈹€鈹€
async function loadPolicy() {
    const data = await api('/api/automation/policy');
    const p = data.effective || {};
    document.getElementById('pl-mode').value = p.approval_policy || 'auto';
    document.getElementById('pl-allow').value = (p.allowed_tools || []).join(',');
    document.getElementById('pl-deny').value = (p.denied_tools || []).join(',');
    document.getElementById('pl-shell').value = (p.allowed_shell_patterns || []).join(',');
    document.getElementById('pl-notify').checked = p.notify_on_danger !== false;
    if (data.has_org_policy) toast('妫€娴嬪埌缁勭粐绾х瓥鐣ワ紙/etc/scout/requirements.json锛夛紝灏嗗己鍒惰鐩栫敤鎴烽厤缃?);
}
async function savePolicy() {
    const body = {
        approval_policy: document.getElementById('pl-mode').value,
        allowed_tools: document.getElementById('pl-allow').value.split(',').map(s => s.trim()).filter(Boolean),
        denied_tools: document.getElementById('pl-deny').value.split(',').map(s => s.trim()).filter(Boolean),
        allowed_shell_patterns: document.getElementById('pl-shell').value.split(',').map(s => s.trim()).filter(Boolean),
        notify_on_danger: document.getElementById('pl-notify').checked,
    };
    const r = await api('/api/automation/policy', 'POST', body);
    if (r.status === 'ok') {
        const el = document.getElementById('pl-saved');
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 2000);
    } else toast(r.error || '淇濆瓨澶辫触', false);
}

// 鈹€鈹€ 瀹氭椂浠诲姟妯℃澘 鈹€鈹€
const CRON_TEMPLATES = {
    report: {

function fillCronTemplate(key) {
    const t = CRON_TEMPLATES[key];
    if (!t) return;
    document.getElementById('cron-name').value = t.name;
    document.getElementById('cron-schedule').value = t.schedule;
    document.getElementById('cron-task').value = t.task;
}

// 鈹€鈹€ 瀹氭椂浠诲姟 鈹€鈹€
async function loadCron() {
    const data = await api('/api/cron');
    const list = document.getElementById('cron-list');
    const tasks = data.tasks || [];
    if (!tasks.length) {
        list.innerHTML = '<div class="text-center text-ink-3 text-sm py-8">鏆傛棤瀹氭椂浠诲姟</div>';
        return;
    }
    list.innerHTML = tasks.map(t => `
        <div class="bg-surface-1 border border-line rounded-xl p-3 flex items-center gap-3">
            <span>鈴?/span>
            <div class="flex-1">
                <div class="text-sm text-ink-1">${esc(t.name)} <span class="text-xs text-ink-3">${esc(t.schedule)}</span></div>
                <div class="text-xs text-ink-3 truncate">${esc(t.task)}</div>
            </div>
            <span class="text-xs ${t.enabled ? 'text-success' : 'text-ink-3'}">${t.enabled ? '鍚敤' : '鍋滅敤'}</span>
            <button onclick="delCron('${esc(t.name)}')" class="px-2.5 py-1 rounded-lg text-xs bg-danger/10 text-danger hover:bg-danger/20 transition-colors">鍒犻櫎</button>
        </div>`).join('');
}
async function delCron(name) {
    if (!confirm(__tpl(`鍒犻櫎瀹氭椂浠诲姟銆?{name}銆嶏紵`))) return;
    await api(`/api/cron/${encodeURIComponent(name)}`, 'DELETE');
    loadCron();
}
async function addCron() {
    const body = {
        name: document.getElementById('cron-name').value.trim(),
        schedule: document.getElementById('cron-schedule').value.trim(),
        task: document.getElementById('cron-task').value.trim(),
    };
    if (!body.name || !body.schedule || !body.task) { toast('鎵€鏈夊瓧娈靛繀濉?, false); return; }
    const r = await api('/api/cron', 'POST', body);
    if (r.status === 'ok' || r.task) { toast('瀹氭椂浠诲姟宸插垱寤?); loadCron(); } else toast(r.error || '鍒涘缓澶辫触', false);
}
