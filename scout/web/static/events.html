<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浜嬩欢鎬荤嚎 路 Scout Agent</title>
    <script src="/static/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/i18n.js"></script>
<!-- 鏋勫缓浜х墿锛歠rontend/src/app.css锛屾敼鏍峰紡璇锋敼閭ｉ噷鍐?npm run build -->
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/theme-workbuddy.css">
</head>
<body class="h-screen overflow-hidden bg-surface-0 text-ink-1 flex flex-col">
    <script>renderLangToggle();</script>

<!-- 椤舵爮 -->
<div class="flex items-center gap-3 px-4 py-3 border-b border-line-soft flex-shrink-0">
    <a href="/" class="p-2 -ml-2 rounded-lg hover:bg-surface-3 text-ink-3 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-lg font-bold text-ink-1">馃摗 浜嬩欢鎬荤嚎</h1>
    <span class="text-xs text-ink-3">EventBus 路 妯″潡闂存澗鑰﹀悎閫氫俊</span>
    <div class="flex-1"></div>
    <span id="dlq-badge" class="badge bg-surface-3 text-ink-3 hidden">DLQ: 0</span>
    <button onclick="loadAll()" class="btn-ghost text-xs">鍒锋柊</button>
</div>

<div class="flex-1 flex overflow-hidden">
    <!-- 宸︽爮锛氫簨浠舵祦 -->
    <div class="flex-1 flex flex-col overflow-hidden border-r border-line-soft">
        <div class="px-4 py-2.5 border-b border-line-soft flex items-center gap-2 flex-shrink-0">
            <span class="text-sm text-ink-2 font-medium">浜嬩欢娴?/span>
            <select id="ev-filter" class="bg-surface-3 border border-line rounded px-2 py-1 text-xs text-ink-2" onchange="loadEvents()">
                <option value="">鍏ㄩ儴浜嬩欢</option>
                <option value="notification">notification</option>
                <option value="task.complete">task.complete</option>
                <option value="fs.event">fs.event</option>
            </select>
            <div class="flex-1"></div>
            <span class="text-xs text-ink-3">鏈€澶氫繚鐣?100 鏉?/span>
        </div>
        <div id="event-stream" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </div>

    <!-- 鍙虫爮锛氭淇￠槦鍒?-->
    <div class="w-[420px] flex-shrink-0 flex flex-col overflow-hidden">
        <div class="px-4 py-2.5 border-b border-line-soft flex items-center gap-2 flex-shrink-0">
            <span class="text-sm text-ink-2 font-medium">馃拃 姝讳俊闃熷垪 (DLQ)</span>
            <span class="text-xs text-ink-3">浜嬩欢澶勭悊澶辫触鐨勮褰?/span>
            <div class="flex-1"></div>
            <button onclick="clearDlq()" class="text-xs text-ink-3 hover:text-danger">娓呯┖</button>
        </div>
        <div id="dlq-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </div>
</div>

<div id="toast" class="toast bg-surface-3"></div>

<script>
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function toast(msg) {
    msg = __tpl(msg);
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}
function fmtTime(iso) {
    if (!iso) return '';
    try {
        const t = new Date(iso);
        return t.toLocaleTimeString('zh-CN', {hour12:false});
    } catch(e) { return iso; }
}
function typeColor(type) {
    if (type.includes('notification')) return '#22d3ee';
    if (type.includes('task.complete')) return '#10b981';
    if (type.includes('fs.event')) return '#f59e0b';
    return '#64748b';
}

// 鈹€鈹€ 浜嬩欢娴?鈹€鈹€
async function loadEvents() {
    const filter = document.getElementById('ev-filter').value;
    const el = document.getElementById('event-stream');
    try {
        const r = await fetch('/api/events?limit=100');
        const { events } = await r.json();
        let list = events || [];
        if (filter) list = list.filter(e => e.type === filter);
        if (list.length === 0) {
            el.innerHTML = '<div class="text-center text-ink-3 text-sm py-20">鏆傛棤浜嬩欢</div>';
            return;
        }
        el.innerHTML = list.map(e => {
            const d = e.data || {};
            const color = typeColor(e.type);
            const title = d.title || d.name || (d.event_type ? `${d.event_type} ${d.relative||d.path||''}` : '');
            const detail = JSON.stringify(d, null, 1);
            return `
            <div class="card p-3 space-y-1">
                <div class="flex items-center gap-2">
                    <span class="ev-type text-xs font-medium" style="color:${color}">${esc(e.type)}</span>
                    <span class="text-xs text-ink-3">${fmtTime(e.timestamp)}</span>
                    ${d.status ? `<span class="text-xs text-ink-3">${esc(d.status)}</span>` : ''}
                </div>
                ${title ? `<div class="text-xs text-ink-2 truncate">${esc(String(title).slice(0, 60))}</div>` : ''}
                <details>
                    <summary class="text-xs text-ink-3 cursor-pointer hover:text-ink-2">杞借嵎</summary>
                    <pre class="detail text-xs bg-scrim/30 rounded p-2 mt-1 text-ink-3">${esc(detail)}</pre>
                </details>
            </div>`;
        }).join('');
    } catch(e) {
        el.innerHTML = '<div class="text-center text-danger text-sm py-20">鍔犺浇澶辫触: ' + e.message + '</div>';
    }
}

// 鈹€鈹€ DLQ 鈹€鈹€
async function loadDlq() {
    const el = document.getElementById('dlq-list');
    try {
        const r = await fetch('/api/events/dlq?limit=50');
        const { dlq, size } = await r.json();
        const badge = document.getElementById('dlq-badge');
        badge.classList.toggle('hidden', !size);
        badge.textContent = `DLQ: ${size || 0}`;
        badge.className = 'badge ' + (size ? 'bg-danger/10 text-danger' : 'bg-surface-3 text-ink-3 hidden');
        if (!dlq || dlq.length === 0) {
            el.innerHTML = '<div class="text-center text-ink-3 text-sm py-20">鏃犳淇¤褰?/div>';
            return;
        }
        el.innerHTML = dlq.map((d, i) => `
            <div class="card p-3 border-danger/20">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs text-danger font-medium">${esc(d.error_type || 'Error')}</span>
                    <span class="text-xs text-ink-3">${fmtTime(d.timestamp)}</span>
                </div>
                <div class="text-xs text-ink-3 mb-1 truncate">handler: <span class="ev-type">${esc(d.handler)}</span></div>
                <div class="text-xs text-danger/80 truncate">${esc(d.error || '')}</div>
                <details class="mt-1">
                    <summary class="text-xs text-ink-3 cursor-pointer hover:text-ink-2">浜嬩欢杞借嵎</summary>
                    <pre class="detail text-xs bg-scrim/30 rounded p-2 mt-1 text-ink-3">${esc(JSON.stringify(d.event, null, 1))}</pre>
                </details>
            </div>`).join('');
    } catch(e) {
        el.innerHTML = '<div class="text-center text-danger text-sm py-20">鍔犺浇澶辫触: ' + e.message + '</div>';
    }
}

async function clearDlq() {
    if (!confirm(__t('纭娓呯┖姝讳俊闃熷垪锛?))) return;
    try {
        const r = await fetch('/api/events/dlq', { method: 'DELETE' });
        const d = await r.json();
        toast(__tpl(`宸叉竻绌?${d.cleared || 0} 鏉));
        loadDlq();
    } catch(e) { toast('娓呯┖澶辫触'); }
}

function loadAll() {
    loadEvents();
    loadDlq();
}

// 鑷姩鍒锋柊浜嬩欢娴?
setInterval(() => { loadEvents(); loadDlq(); }, 5000);
loadAll();
</script>
<script src="/static/js/subshell.js"></script>
</body>
</html>
