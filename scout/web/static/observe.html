<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杩愯瑙傛祴 路 Scout Agent</title>
    <script src="/static/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/i18n.js"></script>
<!-- 鏋勫缓浜х墿锛歠rontend/src/app.css锛屾敼鏍峰紡璇锋敼閭ｉ噷鍐?npm run build -->
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/theme-workbuddy.css">
</head>
<body class="h-screen overflow-hidden bg-surface-0 text-ink-1 flex flex-col">
    <script>renderLangToggle();</script>

<!-- 椤舵爮 -->
<div class="flex items-center gap-3 px-4 py-3 border-b border-line-soft flex-shrink-0">
    <a href="/" class="p-2 -ml-2 rounded-lg hover:bg-surface-3 text-ink-3 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-lg font-bold text-ink-1">杩愯瑙傛祴鏃堕棿绾?/h1>
    <div id="stats-cards" class="flex-1 flex items-center gap-2 justify-end text-xs text-ink-3"></div>
    <button onclick="loadAll()" class="px-3 py-1.5 rounded-lg text-xs bg-surface-3 hover:bg-surface-4 text-ink-2 transition-colors">鍒锋柊</button>
</div>

<div class="flex-1 flex overflow-hidden">
    <!-- 宸︽爮锛氫細璇濆垪琛?-->
    <div class="w-80 flex-shrink-0 border-r border-line-soft overflow-y-auto">
        <div class="px-3 py-2 text-xs text-ink-3 border-b border-line-soft sticky top-0 bg-surface-0 z-10">鏈€杩戜細璇濓紙鎸?trace 鑱氬悎锛?/div>
        <div id="session-list"></div>
    </div>

    <!-- 鍙虫爮锛氭椂闂寸嚎 -->
    <div class="flex-1 overflow-y-auto p-4" id="timeline-pane">
        <div class="text-center text-ink-3 text-sm py-20">鈫?閫夋嫨涓€涓細璇濇煡鐪嬫墽琛屾椂闂寸嚎</div>
    </div>
</div>

<script>
const TYPE_META = {
    llm: { label: 'LLM', cls: 'span-type-llm', icon: '馃' },
    tool: { label: '宸ュ叿', cls: 'span-type-tool', icon: '馃敡' },
    reflection: { label: '鍙嶆€?, cls: 'span-type-reflection', icon: '馃挱' },
    conversation: { label: '瀵硅瘽', cls: 'span-type-conversation', icon: '馃挰' },
    goal: { label: '鐩爣', cls: 'span-type-goal', icon: '馃幆' },
};

function fmtMs(ms) {
    if (ms == null) return '-';
    if (ms < 1000) return ms + 'ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
    return (ms / 60000).toFixed(1) + 'min';
}
function fmtTime(iso) {
    if (!iso) return '';
    return iso.slice(11, 19);
}
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function typeMeta(span) {
    if (span.type === 'tool' && span.status === 'error') return { label: '宸ュ叿鉁?, cls: 'span-type-tool-error', icon: '鉂? };
    // 鑷剤灏濊瘯鐨?span锛坢etadata 鏍囪锛?
    if (span.metadata && span.metadata.heal) return { label: '鑷剤', cls: 'span-type-heal', icon: '馃┕' };
    return TYPE_META[span.type] || { label: span.type, cls: 'span-type-conversation', icon: '路' };
}

async function loadAll() {
    loadStats();
    loadSessions();
}

async function loadStats() {
    try {
        const r = await fetch('/api/observability/stats?hours=24');
        const { stats } = await r.json();
        if (!stats) return;
        const el = document.getElementById('stats-cards');
        el.innerHTML = `
            <span class="px-2 py-1 rounded bg-surface-3">24h 瀵硅瘽 <b class="text-ink-2">${stats.total_traces}</b></span>
            <span class="px-2 py-1 rounded bg-surface-3">鎴愬姛鐜?<b class="text-ink-2">${(stats.success_rate * 100).toFixed(0)}%</b></span>
            <span class="px-2 py-1 rounded bg-surface-3">Token <b class="text-ink-2">${(stats.total_tokens || 0).toLocaleString()}</b></span>
            ${stats.total_cost ? `<span class="px-2 py-1 rounded bg-surface-3">鎴愭湰 <b class="text-accent-text">楼${stats.total_cost.toFixed(3)}</b></span>` : ''}
        `;
    } catch (e) { console.error(e); }
}

async function loadSessions() {
    const list = document.getElementById('session-list');
    try {
        const r = await fetch('/api/traces/by-session?limit=30');
        const { sessions } = await r.json();
        if (!sessions || sessions.length === 0) {
            list.innerHTML = '<div class="px-3 py-6 text-xs text-ink-3 text-center">鏆傛棤杩借釜鏁版嵁</div>';
            return;
        }
        list.innerHTML = sessions.map(s => `
            <div class="session-item px-3 py-2.5 border-b border-line-soft cursor-pointer hover:bg-surface-3 transition-colors"
                 data-sid="${s.session_id}" onclick="selectSession('${s.session_id}')">
                <div class="text-sm text-ink-2 truncate">${esc((s.first_message || '(绌?').slice(0, 40))}</div>
                <div class="text-xs text-ink-3 mt-0.5 flex items-center gap-2">
                    <span>${__tpl(`${s.trace_count} 杞甡)}</span>
                    <span>${(s.tokens || 0).toLocaleString()} tok</span>
                    <span>${fmtTime(s.last_time).slice(0,5) ? s.last_time.slice(5,16).replace('T',' ') : ''}</span>
                    ${s.successes < s.trace_count ? '<span class="text-warn">鈿?/span>' : ''}
                </div>
            </div>
        `).join('');
    } catch (e) {
        list.innerHTML = '<div class="px-3 py-6 text-xs text-danger text-center">' + __tpl(`鍔犺浇澶辫触: ${e.message}`) + '</div>';
    }
}

async function selectSession(sid) {
    document.querySelectorAll('.session-item').forEach(el => {
        el.classList.toggle('bg-surface-3', el.dataset.sid === sid);
    });
    const pane = document.getElementById('timeline-pane');
    pane.innerHTML = '<div class="text-center text-ink-3 text-sm py-20">鍔犺浇涓?..</div>';
    try {
        const r = await fetch(`/api/traces/session/${sid}`);
        const { traces } = await r.json();
        renderTimeline(traces || []);
    } catch (e) {
        pane.innerHTML = '<div class="text-center text-danger text-sm py-20">' + __tpl(`鍔犺浇澶辫触: ${e.message}`) + '</div>';
    }
}

function renderTimeline(traces) {
    const pane = document.getElementById('timeline-pane');
    if (!traces.length) {
        pane.innerHTML = '<div class="text-center text-ink-3 text-sm py-20">璇ヤ細璇濇病鏈夎拷韪暟鎹?/div>';
        return;
    }
    pane.innerHTML = traces.map((t, ti) => {
        const total = t.total_duration_ms || 1;
        const traceStart = new Date(t.start_time).getTime();
        const spansHtml = (t.spans || []).map((s, si) => {
            const meta = typeMeta(s);
            const start = new Date(s.start_time).getTime();
            const offsetPct = Math.max(0, Math.min(99, ((start - traceStart) / total) * 100));
            const widthPct = Math.max(0.6, Math.min(100 - offsetPct, (s.duration_ms / total) * 100));
            const errBadge = s.error ? ' <span class="text-danger">鈿?/span>' : '';
            const detailId = `d-${ti}-${si}`;
            return `
            <div class="border-b border-line-soft last:border-0">
                <div class="flex items-center gap-2 px-2 py-1.5 hover:bg-surface-3">
                    <span class="w-12 flex-shrink-0 text-xs text-ink-3 text-right">${fmtTime(s.start_time)}</span>
                    <span class="w-16 flex-shrink-0 text-xs truncate" title="${esc(meta.label)}: ${esc(s.name)}">${meta.icon} ${esc(s.name.split('(')[0].slice(0, 9))}</span>
                    <div class="flex-1 relative h-6 bg-surface-3 rounded overflow-hidden">
                        <div class="span-bar ${meta.cls}" style="left:${offsetPct}%; width:${widthPct}%;"
                             title="${esc(s.name)} 路 ${fmtMs(s.duration_ms)}"
                             onclick="toggleDetail('${detailId}')"></div>
                    </div>
                    <span class="w-14 flex-shrink-0 text-xs text-ink-3 text-right">${fmtMs(s.duration_ms)}${errBadge}</span>
                </div>
                <div id="${detailId}" class="hidden px-4 pb-3">
                    <div class="text-xs text-ink-3 mb-1">${meta.label} 路 ${esc(s.name)} 路 ${__tpl(`鐘舵€?${s.status}`)}${s.metadata && s.metadata.model ? ' 路 model=' + esc(s.metadata.model) : ''}</div>
                    ${s.input && Object.keys(s.input).length ? `<div class="text-xs text-ink-3 mt-1">杈撳叆:</div><pre class="detail-box text-xs bg-scrim/40 rounded p-2 text-ink-2">${esc(JSON.stringify(s.input, null, 1))}</pre>` : ''}
                    ${s.output && Object.keys(s.output).length ? `<div class="text-xs text-ink-3 mt-2">杈撳嚭:</div><pre class="detail-box text-xs bg-scrim/40 rounded p-2 text-ink-2">${esc(JSON.stringify(s.output, null, 1))}</pre>` : ''}
                    ${s.error ? `<div class="text-xs text-danger mt-2">${__tpl(`閿欒: ${esc(s.error)}`)}</div>` : ''}
                </div>
            </div>`;
        }).join('');

        const statusIcon = t.status === 'success' ? '鉁? : (t.status === 'error' ? '鉂? : '鈴?);
        return `
        <div class="trace-card border border-line rounded-xl mb-4 bg-surface-1">
            <div class="px-3 py-2.5 border-b border-line-soft flex items-center gap-2 flex-wrap">
                <span>${statusIcon}</span>
                <span class="text-sm text-ink-1 flex-1 truncate" title="${esc(t.user_message)}">${esc((t.user_message || '').slice(0, 80) || '(鏃犳秷鎭?')}</span>
                <span class="text-xs text-ink-3">${fmtTime(t.start_time)}</span>
                <span class="text-xs text-ink-3">鈴?${fmtMs(t.total_duration_ms)}</span>
                <span class="text-xs text-ink-3">馃敜 ${(t.total_tokens || 0).toLocaleString()}</span>
                ${t.total_cost ? `<span class="text-xs text-accent-text">楼${t.total_cost.toFixed(4)}</span>` : ''}
                <span class="text-xs text-ink-3">${(t.spans || []).length} spans</span>
            </div>
            ${spansHtml || '<div class="px-3 py-3 text-xs text-ink-3">鏃?span 鏁版嵁</div>'}
        </div>`;
    }).join('');
}

function toggleDetail(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden');
}

loadAll();
</script>
<script src="/static/js/subshell.js"></script>
</body>
</html>
